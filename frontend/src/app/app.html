<header>
  <a routerLink="/" class="brand">Solar Battery Planner</a>
  @if (auth.user(); as user) {
    <nav>
      <a
        class="nav-button"
        routerLink="/plan"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Charge plan</a
      >
      <a
        class="nav-button"
        routerLink="/forecast"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Forecast</a
      >
      <a
        class="nav-button"
        routerLink="/inverter"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Inverter</a
      >
      <a
        class="nav-button"
        routerLink="/setup"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >System</a
      >
      <a
        class="nav-button"
        routerLink="/data"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Data</a
      >
      <span class="muted user">{{ user.email }}</span>
      <button type="button" class="nav-button" (click)="logout()">Sign out</button>
    </nav>
  }
</header>
<main>
  <router-outlet />
</main>
