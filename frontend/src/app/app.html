<header>
  <a routerLink="/" class="brand">Solar Battery Planner</a>
  @if (auth.user(); as user) {
    <nav>
      <a routerLink="/plan">Charge plan</a>
      <a routerLink="/forecast">Forecast</a>
      <a routerLink="/setup">System</a>
      <a routerLink="/data">Data</a>
      <span class="muted">{{ user.email }}</span>
      <button type="button" class="link" (click)="logout()">Sign out</button>
    </nav>
  }
</header>
<main>
  <router-outlet />
</main>
