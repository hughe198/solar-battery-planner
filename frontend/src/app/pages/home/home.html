<div class="home-head">
  <h1>Home</h1>
  <p class="data-freshness muted" aria-live="polite">
    @if (updating()) {
      Fetching your latest readings…
    } @else if (dataUpTo(); as upTo) {
      Readings up to {{ upTo }}.
    }
    @if (status()?.fox_ess && !updating()) {
      <button type="button" class="link" (click)="update()">Update now</button>
    }
  </p>
</div>
@if (updateError(); as message) {
  <p class="form-error" role="alert">{{ message }}</p>
}

<div class="home-cards" [class.evening]="evening()">
  <app-battery-card
    [recent]="recent()"
    [inProgress]="replay()?.in_progress"
    [capacityKwh]="system()?.battery?.capacity_kwh ?? null"
    [timeZone]="timeZone()"
    [today]="today()"
    [morning]="!evening()"
  />
  <app-today-card
    [forecast]="todayForecast()"
    [error]="forecastError()"
    [recent]="recent()"
    [timeZone]="timeZone()"
    [today]="today()"
    [morning]="!evening()"
  />
  <app-yesterday-card
    [lookBack]="lookBack()"
    [missing]="lookBackMissing()"
    [connected]="!!status()?.fox_ess"
    [day]="yesterdayDate()"
  />
  <app-tonight-card
    [plan]="plan()"
    [error]="planError()"
    [actions]="controlActions()"
    [timeZone]="timeZone()"
  />
</div>
